run:
  name: report_smoke
  run_dir: runs/report_smoke
  seed: 123
  resume: false

inputs:
  ligand_path: data/ligand.pdb
  seed_sequences_path: ""

ce:
  length: 30
  batch: 4
  iters: 1
  topN: 5
  elite_frac: 0.25
  alpha: 0.7

eval:
  omp_threads: 1
  simrna_iterations: 20000
  simrna_frames: "1:2"
  decoy_agg: min

  vina_exhaustiveness: 2
  vina_cpu: 1
  grid_padding: 4.0

  ligand_conformers: 3
  ligand_seed: 1
  ligand_prune_rmsd: 0.5
  ligand_forcefield: MMFF
  ligand_optimize: true
  ligand_max_opt_iters: 50
