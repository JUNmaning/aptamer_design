run:
  run_dir: runs/ce_run3
  seed: 123
  log_level: INFO
  workers: 30

inputs:
  ligand: data/PFHxS.sdf

ce:
  length: 30
  alphabet: RNA
  batch: 1000
  iters: 30
  elite_frac: 0.1
  alpha: 0.4
  min_prob: 0.05
  temperature: 1.0
  topN: 50

eval:
  simrna_config: /root/autodl-tmp/SimRNA/config.dat
  omp_threads: 1
  simrna_iterations: 8000
  simrna_frames: "2-3"
  decoy_agg: "min"
  vina_exhaustiveness: 6
  vina_cpu: 1
  grid_padding: 8.0

  ligand_conformers: 2
  ligand_seed: 123
  ligand_prune_rmsd: 0.5
  ligand_forcefield: "MMFF"
  ligand_optimize: true
  ligand_max_opt_iters: 200

regularize:
  entropy_uniform_mix: 0.15
  elite_min_hamming: 0.20
  struct_unique: false
  struct_metric: bp
  struct_min_dist: 0.0

monitor:
  penalty_skip:
    enabled: true
    frac_thr: 0.95
    action: skip
    reset_patience: 2

  early_stop:
    enabled: false
    patience: 6
    min_improve: 0.01

  collapse:
    enabled: true
    max_prob: 0.95
    frac_thr: 0.60
    patience: 5

  external_stop:
    gbsa_patience: 6
    gbsa_min_improve: 0.01
    dock_patience: 6
    dock_min_improve: 0.01

rescore:
  enabled: true
  top_frac: 0.1
  elite_frac: 0.5
  include_penalty: false
  gbsa_workers: 30
  gbsa_charge_method: bcc
  mmgbsa_igb: 5
  mmgbsa_saltcon: 0.150
  mmgbsa_minimize: true
  mmgbsa_min_restraint: true
  mmgbsa_min_maxcyc: 1500
  mmgbsa_min_ncyc: 500
  mmgbsa_min_restraint_wt: 2.0
  mmgbsa_min_restraint_mask: "!:LIG & !@H="

md:
  enabled: false
  topX: 10
  gmx: gmx
  mdp_dir: mdp
  forcefield: amber99sb-ildn
  water: tip3p
  box_type: cubic
  box_distance_nm: 1.0
  salt_conc_m: 0.15
  neutralize: true
  threads: 0
  gpu: false
  skip_if_done: true
  strip_5prime_phosphate: true
  strip_3prime_phosphate: false
