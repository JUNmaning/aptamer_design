run:
  run_dir: runs/ce_run1
  seed: 123
  log_level: INFO
  workers: 4

inputs:
  ligand: data/ligand.sdf

ce:
  length: 30
  alphabet: RNA
  batch: 4
  iters: 5
  elite_frac: 0.2
  alpha: 0.4
  min_prob: 0.02
  temperature: 1.0
  topN: 20

eval:
  omp_threads: 1
  simrna_iterations: 20000
  simrna_frames: "1-3"
  decoy_agg: "min"
  vina_exhaustiveness: 8
  vina_cpu: 1
  grid_padding: 8.0

  ligand_conformers: 2
  ligand_seed: 123
  ligand_prune_rmsd: 0.5
  ligand_forcefield: "MMFF"
  ligand_optimize: true
  ligand_max_opt_iters: 200

regularize:
  entropy_uniform_mix: 0.02
  diversity_weight: 0.10
  elite_min_hamming: 0.10
  elite_diverse: true

monitor:
  penalty_threshold: 1.0e8

  early_stop:
    enabled: true
    patience: 5
    min_improve: 0.05

  collapse:
    enabled: true
    max_prob: 0.95
    frac_thr: 0.60
    patience: 3
rescore:
  enabled: true
  topM: 5
  include_penalty: false
md:
  enabled: true
  topX: 10
  gmx: gmx
  mdp_dir: mdp
  forcefield: amber99sb-ildn
  water: tip3p
  box_type: cubic
  box_distance_nm: 1.0
  salt_conc_m: 0.15
  neutralize: true
  threads: 0
  gpu: false
  skip_if_done: true
  strip_5prime_phosphate: true
  strip_3prime_phosphate: false